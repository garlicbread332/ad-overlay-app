name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Expo prebuild (Android)
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Make Gradlew executable
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      - name: Build APK (debug)
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-overlay-app-debug
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
